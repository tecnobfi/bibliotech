<!--
 * @file client_dashboard.html
 * @brief Panel privado del cliente. Permite cargar, leer y borrar documentos PDF.
 * @project Bibliotech
 * @author Tecnologías Informáticas B - Facultad de Ingeniería - UNMdP
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliotech - Mis Documentos</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>
<body>

<!-- Barra de navegación superior -->
<div class="w3-bar w3-black w3-border-bottom w3-border-dark-grey">
    <span class="w3-bar-item w3-text-teal"><b>BIBLIOTECH</b></span>
    <!-- La clase 'btn-logout' es detectada y enlazada globalmente por auth_helper.js -->
    <button class="w3-bar-item w3-button w3-right btn-logout">Salir</button>
</div>

<div class="w3-container w3-padding-32">
    <div class="w3-row-padding">
        
        <!-- Formulario de Subida (Columna izquierda responsiva) -->
        <div class="w3-col l4 m5 s12">
            <div class="w3-card-4 vault-card w3-padding w3-round">
                <h3 class="w3-text-teal">Subir Nuevo PDF</h3>
                <form id="uploadForm">
                    <label>Título del Documento</label>
                    <input class="w3-input w3-border w3-round w3-transparent w3-text-white" type="text" id="title" required>
                    
                    <label class="w3-margin-top w3-show">Autor</label>
                    <input class="w3-input w3-border w3-round w3-transparent w3-text-white" type="text" id="author" required>

                   <!--
                    * @brief Selector dinámico de categorías.
                    * @details Las opciones se obtienen desde la API
                    * y se generan mediante books_front_controller.js.
                   -->
                  <label class="w3-margin-top w3-show">Categoría</label>
                  <select class="w3-select w3-border w3-round w3-black w3-text-white"
                          id="category"
                          required>
</select>

                    <label class="w3-margin-top w3-show">Páginas</label>
                    <input class="w3-input w3-border w3-round w3-transparent w3-text-white" type="number" id="pages" value="10" min="1" required>

                    <label class="w3-margin-top w3-show">Archivo de Documento (.PDF)</label>
                    <input class="w3-input w3-border w3-round" type="file" id="pdfFile" accept="application/pdf" required>

                    <button type="submit" class="w3-button w3-teal w3-block w3-round-large w3-margin-top">
                        <b>CARGAR A LA BIBLIOTECA</b>
                    </button>
                </form>
            </div>
        </div>

        <!-- Listado de Documentos dinámico (Columna derecha) -->
        <div class="w3-col l8 m7 s12">
            <h3 class="w3-text-white">Mi Biblioteca Privada</h3>
            <div class="w3-responsive">
                <table class="w3-table w3-striped w3-bordered vault-card">
                    <thead>
                        <tr class="w3-teal">
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Categoría</th>
                            <th>Páginas</th>
                            <th>Lectura</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <!-- Contenedor vacío donde books_front_controller.js inyectará filas <tr> de forma segura -->
                    <tbody id="booksTableBody">
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="../js/services/api_service.js"></script>
<script src="../js/components/ui_handlers.js"></script>
<script src="../js/utils/auth_helper.js"></script>
<script src="../js/front_controllers/books_front_controller.js"></script>
</body>
</html>
