<!--
 * @file audit_dashboard.html
 * @brief Panel de Auditoría: historial de acciones críticas registradas en el sistema.
 * @project Bibliotech
 * @author Tecnologías Informáticas B - Facultad de Ingeniería - UNMdP
 * @details Pantalla exclusiva del administrador. Es una vista separada del panel de usuarios
 * para respetar la responsabilidad única de cada controlador frontend
 * (admin_front_controller gestiona usuarios, audit_front_controller muestra el historial).
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliotech - Auditoría</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>
<body>

<div class="w3-bar w3-teal w3-card">
    <span class="w3-bar-item"><b>CONTROL DE ADMINISTRACIÓN</b></span>
    <a href="/admin_dashboard" class="w3-bar-item w3-button">Usuarios</a>
    <a href="/audit_dashboard" class="w3-bar-item w3-button w3-dark-grey">Auditoría</a>
    <!-- La clase 'btn-logout' es detectada y enlazada globalmente por auth_helper.js -->
    <button class="w3-bar-item w3-button w3-right btn-logout">Salir</button>
</div>

<div class="w3-container w3-padding-32">
    <h2 class="w3-text-white">Historial de Auditoría</h2>
    <p>Registro persistente de acciones críticas (eliminación de documentos y de usuarios), del más reciente al más antiguo.</p>

    <button id="btnRefreshLogs" class="w3-button w3-teal w3-margin-bottom">Actualizar</button>

    <div class="w3-responsive">
        <table class="w3-table w3-striped w3-bordered vault-card">
            <thead>
                <tr class="w3-dark-grey">
                    <th>Fecha y hora</th>
                    <th>Usuario</th>
                    <th>Acción</th>
                    <th>Recurso afectado</th>
                    <th>IP de origen</th>
                </tr>
            </thead>
            <!-- Contenedor dinámico poblado por audit_front_controller.js -->
            <tbody id="auditTableBody">
            </tbody>
        </table>
    </div>
</div>

<script src="../js/services/api_service.js"></script>
<script src="../js/utils/auth_helper.js"></script>
<script src="../js/components/ui_handlers.js"></script>
<script src="../js/front_controllers/audit_front_controller.js"></script>
</body>
</html>
